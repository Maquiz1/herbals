{% extends "base.html" %}

{% block content %}

<div class="container">

    <h3>

        {% if is_update %}
        Edit CRF1
        {% else %}
        Create CRF1
        {% endif %}

        — {{ visit.get_visit_day_display }}

    </h3>

    <form method="post">

        {% csrf_token %}

        {{ form.as_p }}

        <button class="btn btn-success">
            Save
        </button>

        <a href="{% url 'herbal:subjects-detail' visit.subject.pk %}" class="btn btn-secondary">
            Cancel
        </a>

    </form>

</div>

{% endblock %}
